name: Automate daily NFL prediction refresh

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 10 * * *"

permissions:
  contents: write

concurrency:
  group: nfl-prediction-refresh
  cancel-in-progress: false

jobs:
  refresh-predictions:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate latest predictions
        run: |
          python -m src.run_predictions

      - name: Verify prediction output
        run: |
          test -f data/latest_predictions.csv
          echo "Prediction file created successfully."
          head -n 3 data/latest_predictions.csv

      - name: Commit refreshed predictions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/latest_predictions.csv

          if git diff --cached --quiet; then
            echo "No prediction changes to commit."
          else
            git commit -m "Refresh NFL predictions"
            git push
          fi